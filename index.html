<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origin — Interactive Computer Science</title>
  <meta name="description" content="Immersive, interactive journeys into computer science for curious minds.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css?v=2">
  <link rel="stylesheet" href="rtl.css?v=2">
  <script src="i18n.js"></script>
</head>
<body>
  
  <div class="mesh-bg">
    <div class="mesh-blob blob-1"></div>
    <div class="mesh-blob blob-2"></div>
    <div class="mesh-blob blob-3"></div>
  </div>

  <div class="particles" id="particles"></div>

  <main class="portal-container">
    <div style="width: 100%; display: flex; justify-content: flex-end; margin-bottom: 2rem;">
      <div class="top-controls">
        <button id="themeToggle" class="control-btn">🌙</button>
        <button id="langToggle" class="control-btn">🌐 AR / EN</button>
      </div>
    </div>
    <header class="portal-hero">
      <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
        <div class="badge" data-i18n="portalBadge">Origin Interactive</div>
      </div>
      <h1 data-i18n="portalTitle">Explore the <span class="text-glow">Digital Cosmos</span></h1>
      <p data-i18n="portalDesc">Immersive, story-driven journeys into the history and science of computers. Select your destination.</p>
    </header>

    <section class="journeys-grid" id="journeysGrid">
      <!-- Injected by portal.js -->
    </section>
  </main>

  <footer class="portal-footer">
    <p data-i18n="footerText">Made for curious minds · Intro to Computer Science</p>
  </footer>

  <script src="journeys.js"></script>
  <script src="portal.js"></script>
</body>
</html>
